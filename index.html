<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bits to Image: Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Courier New', monospace; }
        .pixel { image-rendering: pixelated; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="max-w-7xl mx-auto p-8">
        <h1 class="text-4xl font-bold text-center mb-8">Bits → Image Journey</h1>
        
        <!-- Sender -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Sender -->
            <div class="bg-zinc-900 p-6 rounded-xl">
                <h2 class="text-xl font-bold mb-4">1. Sender - Binary Input</h2>
                <textarea id="binaryInput" class="w-full h-48 bg-black p-4 font-mono text-green-400 resize-none" placeholder="Paste 0s and 1s here..."></textarea>
                
                <div class="flex flex-wrap gap-2 mt-4">
                    <button onclick="loadPreset(0)" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded">Black</button>
                    <button onclick="loadPreset(1)" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded">White</button>
                    <button onclick="loadPreset(2)" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded">Checkerboard</button>
                    <button onclick="loadPreset(3)" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded">Gradient</button>
                </div>

                <div id="senderPreview" class="mt-6">
                    <h3 class="text-sm mb-2">Preview</h3>
                    <canvas id="senderCanvas" width="160" height="160" class="border border-zinc-700 bg-black"></canvas>
                </div>
            </div>

            <!-- Middle: Network -->
            <div class="bg-zinc-900 p-6 rounded-xl flex flex-col">
                <h2 class="text-xl font-bold mb-4">2. Network Transmission</h2>
                <button onclick="startTransmission()" class="bg-green-600 hover:bg-green-500 py-4 px-8 rounded-xl text-xl font-bold">🚀 Start Transmission</button>
                <div id="networkLog" class="mt-6 flex-1 font-mono text-sm overflow-auto"></div>
            </div>

            <!-- Right: Receiver -->
            <div class="bg-zinc-900 p-6 rounded-xl">
                <h2 class="text-xl font-bold mb-4">3. Receiver</h2>
                <canvas id="receiverCanvas" width="160" height="160" class="border border-zinc-700 bg-black pixel"></canvas>
                <div id="pngStructure" class="mt-6 text-xs"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPixels = new Array(64).fill(0);

        function updatePreview() {
            const input = document.getElementById('binaryInput').value.replace(/[^01]/g, '');
            const canvas = document.getElementById('senderCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 160, 160);

            let bits = input.padEnd(512, '0').slice(0, 512);
            for (let i = 0; i < 64; i++) {
                const byteStart = i * 8;
                let value = 0;
                for (let b = 0; b < 8; b++) {
                    if (bits[byteStart + b] === '1') value += (1 << (7-b));
                }
                const gray = Math.floor(value / 255 * 255);
                ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
                const x = (i % 8) * 20;
                const y = Math.floor(i / 8) * 20;
                ctx.fillRect(x, y, 20, 20);
            }
        }

        function loadPreset(type) {
            let binary = '';
            if (type === 0) binary = '0'.repeat(512); // Black
            else if (type === 1) binary = '1'.repeat(512); // White
            else if (type === 2) { // Checkerboard
                for (let i = 0; i < 64; i++) binary += (i%2 === 0 ? '11111111' : '00000000');
            }
            else if (type === 3) { // Gradient
                for (let i = 0; i < 64; i++) {
                    const val = Math.floor((i / 63) * 255).toString(2).padStart(8, '0');
                    binary += val;
                }
            }
            document.getElementById('binaryInput').value = binary;
            updatePreview();
        }

        function startTransmission() {
            const log = document.getElementById('networkLog');
            log.innerHTML = '<p class="text-green-400">[NETWORK] Starting transmission...</p>';

            setTimeout(() => {
                log.innerHTML += '<p>[PHYSICAL] Bits traveling as electrical signals...</p>';
            }, 400);

            setTimeout(() => {
                log.innerHTML += '<p>[DATA LINK] Framing + CRC check...</p>';
            }, 900);

            setTimeout(() => {
                log.innerHTML += '<p>[NETWORK] IP Routing...</p>';
            }, 1400);

            setTimeout(() => {
                log.innerHTML += '<p>[TRANSPORT] TCP segments received</p>';
            }, 1900);

            setTimeout(() => {
                const canvas = document.getElementById('receiverCanvas');
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,160,160);

                const input = document.getElementById('binaryInput').value.replace(/[^01]/g,'').padEnd(512,'0').slice(0,512);
                for (let i = 0; i < 64; i++) {
                    const byteStart = i*8;
                    let value = 0;
                    for (let b=0; b<8; b++) {
                        if (input[byteStart+b]==='1') value += 1 << (7-b);
                    }
                    const gray = Math.floor(value / 255 * 255);
                    ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
                    const x = (i % 8) * 20;
                    const y = Math.floor(i / 8) * 20;
                    ctx.fillRect(x, y, 20, 20);
                }

                log.innerHTML += '<p class="text-green-400">[APPLICATION] Image successfully decoded!</p>';

                // PNG Structure
                document.getElementById('pngStructure').innerHTML = `
                    <div class="bg-zinc-800 p-4 rounded">
                        <strong>PNG Structure:</strong><br>
                        • PNG Signature (8 bytes)<br>
                        • IHDR Chunk (Header)<br>
                        • IDAT Chunk (Image Data)<br>
                        • IEND Chunk<br>
                    </div>`;
            }, 2500);
        }

        // Auto update preview
        document.getElementById('binaryInput').addEventListener('input', updatePreview);

        // Load default
        window.onload = () => loadPreset(0);
    </script>
</body>
</html>
